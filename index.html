<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Challenge: Famous font formats</title>
  <style>
    .declaration {
      font-weight: bold;
    }

    .quote {
      font-style: italic;
    }

    h2 {
  font-size: 35px;
  font-weight: bold;
  text-transform: uppercase;
  padding: 0;
  margin: 0;

  color: transparent;
  background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSoYQg3-EfgfhF6B7AmfQvYltOXrD9MkdvnjaLbANgeTw&s=10');
  background-clip: text;
  background-color: green; /* fallback text color if image fails to load */

  /* For older browsers use this instead */
  /*-webkit-background-clip: text;
  -webkit-text-fill-color: transparent;*/
}

  </style>
</head>

<body>

  <h2>Famous quotes</h2>
  <p class="quote">
    "My mama always said life was like a box of chocolates. You never know what you're gonna get.".
    <br> - Forrest Gump
  </p>

  <p class="quote">
    "May the force be with you."
    <br>- Star Wars
  </p>

  <h2>Famous declarations</h2>

  <p class="declaration">
    I'M BATMAN.
  </p>

  <p class="declaration">
    Earth, water, fire. Together, we are CAPTAIN PLANET!
  </p>

</body>

</html>
